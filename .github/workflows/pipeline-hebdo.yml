name: Mise à jour hebdomadaire DOCKZ

on:
  schedule:
    - cron: "0 4 * * 1"   # chaque lundi à 4 h UTC
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NTFY_URL: https://ntfy.sh/${{ secrets.NTFY_TOPIC }}
      # Les conditions "if" ne peuvent pas lire les secrets : on expose seulement s'il existe
      NTFY_ACTIF: ${{ secrets.NTFY_TOPIC != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les secrets
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL : définie"; else echo "DATABASE_URL : vide"; exit 1; fi
          echo "Notifications ntfy actives : $NTFY_ACTIF"

      - name: Entreprises (SIRENE)
        run: python -m pipelines.sirene_ingest

      - name: Diagnostic Géorisques
        continue-on-error: true
        run: |
          curl -sS -m 30 -w "\nHTTP %{http_code} en %{time_total} s\n" \
            "https://georisques.gouv.fr/api/v1/installations_classees?departement=75&page=1&page_size=1" \
            | tail -c 400

      - name: Installations classées (Géorisques)
        id: georisques
        continue-on-error: true
        run: python -m pipelines.georisques_ingest

      - name: Entrepôts et exploitants
        id: georisques_silver
        continue-on-error: true
        run: python -m pipelines.georisques_silver

      - name: Ventes (DVF) téléchargement
        run: python -m pipelines.dvf_download

      - name: Ventes (DVF) nettoyage
        run: python -m pipelines.dvf_silver

      - name: Indicateurs (Gold)
        run: python -m pipelines.build_gold

      - name: Avertissement Géorisques
        if: success() && env.NTFY_ACTIF == 'true' && (steps.georisques.outcome == 'failure' || steps.georisques_silver.outcome == 'failure')
        run: >
          curl -s
          -H "Title: DOCKZ à jour, sauf Géorisques"
          -d "Géorisques n'a pas pu être actualisé : les entrepôts restent sur la version précédente. Relancer en local si besoin."
          "$NTFY_URL"

      - name: Alerte en cas d'échec
        if: failure() && env.NTFY_ACTIF == 'true'
        run: >
          curl -s
          -H "Title: DOCKZ en échec"
          -H "Priority: high"
          -d "La mise à jour hebdomadaire a échoué : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "$NTFY_URL"

      - name: Notification de succès
        if: success() && env.NTFY_ACTIF == 'true' && steps.georisques.outcome == 'success' && steps.georisques_silver.outcome == 'success'
        run: >
          curl -s
          -H "Title: DOCKZ à jour"
          -d "Mise à jour hebdomadaire réussie."
          "$NTFY_URL"
