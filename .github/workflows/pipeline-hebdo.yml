name: Mise à jour hebdomadaire DOCKZ

on:
  schedule:
    - cron: "0 4 * * 1"   # chaque lundi à 4 h UTC
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions

# Géorisques bloque les serveurs cloud : sa collecte est lancée en local une fois par mois
# (python -m pipelines.georisques_ingest). La Silver est reconstruite ici chaque semaine.

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NTFY_URL: https://ntfy.sh/${{ secrets.NTFY_TOPIC }}
      NTFY_ACTIF: ${{ secrets.NTFY_TOPIC != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les secrets
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL : définie"; else echo "DATABASE_URL : vide"; exit 1; fi
          echo "Notifications ntfy actives : $NTFY_ACTIF"

      - name: Entreprises (SIRENE)
        run: python -m pipelines.sirene_ingest

      - name: Entrepôts et exploitants (depuis la dernière collecte Géorisques)
        run: python -m pipelines.georisques_silver

      - name: Ventes (DVF) téléchargement
        run: python -m pipelines.dvf_download

      - name: Ventes (DVF) nettoyage
        run: python -m pipelines.dvf_silver

      - name: Indicateurs (Gold)
        run: python -m pipelines.build_gold

      - name: Alerte en cas d'échec
        if: failure() && env.NTFY_ACTIF == 'true'
        run: >
          curl -s
          -H "Title: DOCKZ en échec"
          -H "Priority: high"
          -d "La mise à jour hebdomadaire a échoué : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "$NTFY_URL"

      - name: Notification de succès
        if: success() && env.NTFY_ACTIF == 'true'
        run: >
          curl -s
          -H "Title: DOCKZ à jour"
          -d "Mise à jour hebdomadaire réussie."
          "$NTFY_URL"
